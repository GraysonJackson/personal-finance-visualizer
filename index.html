<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spending Flow — Personal Finance Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles/main.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <h1 class="site-title">Spending Flow</h1>
            <p class="site-subtitle">Where your money goes, visualized.</p>
        </div>
    </header>

    <main class="dashboard">
        <section class="data-controls">
            <label class="upload-btn">
                Upload CSV
                <input type="file" id="csvUpload" accept=".csv" hidden>
            </label>
            <button class="reset-btn" id="resetData">Reset to Sample Data</button>
            <span class="data-status" id="dataStatus">Using sample data</span>
        </section>

        <section class="chart-section">
            <h2 class="section-title">Income → Spending Flow</h2>
            <div class="chart-container" id="sankeyContainer"></div>
        </section>

        <section class="chart-section">
            <h2 class="section-title">Spending Over Time</h2>
            <div class="chart-container" id="areaContainer"></div>
        </section>

        <section class="summary-section">
            <div class="summary-card" id="totalIncome">
                <span class="summary-label">Monthly Income</span>
                <span class="summary-value">—</span>
            </div>
            <div class="summary-card" id="totalSpending">
                <span class="summary-label">Total Spending</span>
                <span class="summary-value">—</span>
            </div>
            <div class="summary-card" id="netSavings">
                <span class="summary-label">Net Savings</span>
                <span class="summary-value">—</span>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Spending Flow. All data processed locally — nothing leaves your browser.</p>
    </footer>

    <script src="src/js/data.js"></script>
    <script src="src/js/sankey.js"></script>
    <script src="src/js/area-chart.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
